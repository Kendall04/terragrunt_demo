{
  "name": "Protected Read Only Plan",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "string",
          "required": true,
          "description": "dev or prod; selects disjoint fixed entry jobs."
        },
        "request": {
          "type": "string",
          "required": true,
          "description": "Closed operation JSON; never AWS resource or credential inputs."
        }
      }
    },
    "workflow_call": {
      "inputs": {
        "environment": {
          "type": "string",
          "required": true,
          "description": "dev or prod; selects disjoint fixed entry jobs."
        },
        "request": {
          "type": "string",
          "required": true,
          "description": "Closed operation JSON; never AWS resource or credential inputs."
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Protected-Read-Only-Plan-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "dev": {
      "runs-on": "ubuntu-latest",
      "permissions": {},
      "steps": [
        {
          "run": "echo \"::error::E1 plan-dev is inactive: no verified immutable workflow pin, installation and governance binding.\"; exit 1"
        }
      ],
      "if": "${{ inputs.environment == 'dev' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}"
    },
    "prod": {
      "runs-on": "ubuntu-latest",
      "permissions": {},
      "steps": [
        {
          "run": "echo \"::error::E1 plan-prod is inactive: no verified immutable workflow pin, installation and governance binding.\"; exit 1"
        }
      ],
      "if": "${{ inputs.environment == 'prod' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}"
    }
  }
}
