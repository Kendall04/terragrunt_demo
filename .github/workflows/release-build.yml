{
  "name": "Release Build",
  "on": {
    "workflow_dispatch": {
      "inputs": {}
    },
    "workflow_call": {
      "inputs": {}
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Release-Build-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "release": {
      "runs-on": "ubuntu-latest",
      "permissions": {},
      "steps": [
        {
          "run": "echo \"::error::E1 release is inactive: no verified immutable workflow pin, installation and governance binding.\"; exit 1"
        }
      ],
      "if": "${{ github.ref == 'refs/heads/develop' }}"
    }
  }
}
