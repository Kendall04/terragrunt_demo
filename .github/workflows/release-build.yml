{
  "name": "Release Build",
  "on": {
    "workflow_dispatch": {
      "inputs": {}
    },
    "workflow_call": {
      "inputs": {}
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Release-Build-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "release": {
      "uses": "Kendall04/terragrunt_demo/.github/workflows/e1-release.yml@f0ba8ad1d6528d362693c8de932f935c8084529d",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "with": {
        "request": "{\"source_commit\":\"${{ github.sha }}\"}"
      },
      "if": "${{ github.ref == 'refs/heads/codex/final-github-actions-cicd' }}"
    }
  }
}
