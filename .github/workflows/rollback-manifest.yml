{
  "name": "Rollback Manifest",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "string",
          "required": true,
          "description": "dev or prod; selects disjoint fixed entry jobs."
        },
        "history": {
          "type": "string",
          "required": true
        },
        "replicas": {
          "type": "number",
          "default": 1,
          "required": false
        }
      }
    },
    "workflow_call": {
      "inputs": {
        "environment": {
          "type": "string",
          "required": true,
          "description": "dev or prod; selects disjoint fixed entry jobs."
        },
        "history": {
          "type": "string",
          "required": true
        },
        "replicas": {
          "type": "number",
          "default": 1,
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Rollback-Manifest-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "dev": {
      "uses": "Kendall04/terragrunt_demo/.github/workflows/e1-dev-deploy.yml@fe7e775812f139e5c2f6e044d9a37c95b0b747fc",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "with": {
        "request": "{\"action\":\"rollback-release\",\"history\":\"${{ inputs.history }}\",\"replicas\":${{ inputs.replicas }}}"
      },
      "if": "${{ inputs.environment == 'dev' && github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' }}"
    },
    "prod": {
      "runs-on": "ubuntu-latest",
      "permissions": {},
      "steps": [
        {
          "run": "echo \"::error::E1 promote-prod is inactive: no verified immutable workflow pin, installation and governance binding.\"; exit 1"
        }
      ],
      "if": "${{ inputs.environment == 'prod' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}"
    }
  }
}
