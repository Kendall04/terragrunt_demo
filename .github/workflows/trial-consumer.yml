{
  "name": "Receipt prototype consumer",
  "on": {
    "push": {
      "branches": [
        "codex/receipt-attestations-trial-20261109"
      ],
      "paths": [
        "inputs/consume.json"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read",
    "attestations": "read",
    "checks": "read"
  },
  "jobs": {
    "consume": {
      "if": "${{ github.repository == 'Kendall04/terragrunt_demo' && github.ref == 'refs/heads/codex/receipt-attestations-trial-20261109' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "name": "Checkout isolated prototype",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Consume B after simulated merge and publication of C",
          "run": "python3 prototype.py consume fixture"
        },
        {
          "name": "Preserve diagnostic results",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "prototype-consumer-diagnostics",
            "path": "out/",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
