name: CI - .NET + Docker Build

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "8.0.x"

permissions:
  contents: read

jobs:
  dotnet-ci:
    name: .NET Restore • Build • Test • Docker Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./demo-api/terragrunt-demo.sln

      - name: Build
        run: dotnet build ./demo-api/terragrunt-demo.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./demo-api/terragrunt-demo.sln --configuration Release --no-build --verbosity normal

      - name: Validate readiness deployment contracts
        run: |
          set -euo pipefail
          /usr/bin/env -i HOME=/tmp PATH=/usr/bin:/bin BASH_ENV= ENV= \
            /bin/bash --noprofile --norc scripts/tests/run-offline-readiness-tests.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('demo-api/**/*.csproj') }}-${{ hashFiles('demo-api/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-api
          file: ./demo-api/Dockerfile
          tags: demo-api-ci:latest
          load: true
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Verify readiness probe is packaged
        run: |
          set -euo pipefail
          output="$(docker run --rm demo-api-ci:latest readiness-probe --check-capability)"
          grep -Fx 'readiness-probe-capability=available' <<<"$output"
          if docker run --rm \
            -e READINESS_PROBE_TIMEOUT_SECONDS=1 \
            -e READINESS_PROBE_REQUEST_TIMEOUT_SECONDS=1 \
            -e READINESS_PROBE_INTERVAL_SECONDS=1 \
            demo-api-ci:latest readiness-probe; then
            echo "::error::Packaged readiness probe unexpectedly succeeded without a local /ready server."
            exit 1
          fi

      - name: Move Docker cache
        run: |
          set -euo pipefail
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
