{
  "name": "Deploy Dev",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "release_id": {
          "type": "string",
          "required": true
        },
        "replicas": {
          "type": "number",
          "default": 1,
          "required": false
        }
      }
    },
    "workflow_call": {
      "inputs": {
        "release_id": {
          "type": "string",
          "required": true
        },
        "replicas": {
          "type": "number",
          "default": 1,
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Deploy-Dev-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "deploy": {
      "uses": "Kendall04/terragrunt_demo/.github/workflows/e1-dev-deploy.yml@f0ba8ad1d6528d362693c8de932f935c8084529d",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "with": {
        "request": "{\"action\":\"deliver\",\"release_id\":\"${{ inputs.release_id }}\",\"replicas\":${{ inputs.replicas }}}"
      },
      "if": "${{ github.ref == 'refs/heads/codex/final-github-actions-cicd' }}"
    }
  }
}
