name: CI - CD Safety

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  cd-safety:
    name: CD Safety Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check offline dependencies
        id: dependencies
        shell: bash
        run: |
          for tool in bash jq git grep diff find sed mktemp rm dirname basename cat cp mkdir chmod awk; do
            command -v "$tool" >/dev/null || exit 1
          done

      - name: Test selection and result enforcement
        id: self_tests
        shell: bash
        run: |
          bash .github/scripts/cd/tests/test-select-safety-tests.sh
          bash .github/scripts/cd/tests/test-safety-workflow.sh

      - name: Select safety suite from complete event history
        id: selection
        shell: bash
        env:
          SAFETY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SAFETY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/cd/select-safety-tests.sh

      - name: Execute all three safety suites
        id: suite
        if: steps.selection.outputs.selection == 'RUN'
        shell: bash
        run: |
          # BEGIN SAFETY SUITE
          set -uo pipefail
          failed=0
          for suite in detect-scope resolve-terragrunt-layers validate-infra-gate; do
            status=0
            bash ".github/scripts/cd/tests/test-${suite}.sh" || status=$?
            printf '%s exit=%s\n' "$suite" "$status"
            printf '%s=%s\n' "$suite" "$status" >> "$GITHUB_OUTPUT"
            if [[ $status != 0 ]]; then failed=1; fi
          done
          exit "$failed"
          # END SAFETY SUITE

      - name: Validate actual outcomes and summarize
        if: always()
        shell: bash
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          SELF_TESTS: ${{ steps.self_tests.outcome }}
          SELECTOR: ${{ steps.selection.outcome }}
          SELECTION: ${{ steps.selection.outputs.selection }}
          REASON: ${{ steps.selection.outputs.reason }}
          ACTUAL_SHA: ${{ steps.selection.outputs.actual_sha }}
          MERGE_BASE: ${{ steps.selection.outputs.merge_base }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SCOPE_EXIT: ${{ steps.suite.outputs.detect-scope }}
          LAYERS_EXIT: ${{ steps.suite.outputs.resolve-terragrunt-layers }}
          GATE_EXIT: ${{ steps.suite.outputs.validate-infra-gate }}
          JOB_STATUS: ${{ job.status }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # BEGIN SAFETY RESULT
          set -euo pipefail
          result=failed
          if [[ $JOB_STATUS == success && $DEPENDENCIES == success && $SELF_TESTS == success && $SELECTOR == success && $ACTUAL_SHA == "$GITHUB_SHA" && -n $ACTUAL_SHA ]]; then
            if [[ $SELECTION == RUN && -n $REASON && $SUITE_OUTCOME == success && $SCOPE_EXIT == 0 && $LAYERS_EXIT == 0 && $GATE_EXIT == 0 ]]; then
              result='suite passed'
            elif [[ $SELECTION == EXEMPT && $REASON == complete-unrelated-diff && $SUITE_OUTCOME == skipped && -z $SCOPE_EXIT && -z $LAYERS_EXIT && -z $GATE_EXIT ]]; then
              result='suite not required'
            fi
          fi
          {
            printf '## CD Safety Validation\n\n'
            printf 'Result: %s\n\n' "$result"
            printf '```text\n'
            printf 'event=%s ref=%s PR=%s target=%s run=%s attempt=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PR_NUMBER" "$GITHUB_BASE_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'event_test_sha=%s actual_sha=%s base_or_before=%s head_or_push=%s merge_base=%s\n' "$GITHUB_SHA" "$ACTUAL_SHA" "$BASE_SHA" "$HEAD_SHA" "$MERGE_BASE"
            printf 'selection=%s reason=%s dependencies=%s self_tests=%s selector=%s suite=%s job_status=%s\n' "$SELECTION" "$REASON" "$DEPENDENCIES" "$SELF_TESTS" "$SELECTOR" "$SUITE_OUTCOME" "$JOB_STATUS"
            printf 'detect-scope exit=%s\nresolve-terragrunt-layers exit=%s\nvalidate-infra-gate exit=%s\n' "${SCOPE_EXIT:-not executed}" "${LAYERS_EXIT:-not executed}" "${GATE_EXIT:-not executed}"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'CD Safety Validation: %s\n' "$result"
          [[ $result != failed ]]
          # END SAFETY RESULT

# Evidence-only workflow comment: behavior remains unchanged.
