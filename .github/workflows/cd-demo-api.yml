{
  "name": "Application CD",
  "on": {
    "workflow_dispatch": {
      "inputs": {}
    },
    "workflow_call": {
      "inputs": {}
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "e1-Application-CD-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "infra-ready": {
      "runs-on": "ubuntu-latest",
      "permissions": {},
      "steps": [
        {
          "run": "echo \"::error::E1 plan-dev is inactive: no verified immutable workflow pin, installation and governance binding.\"; exit 1"
        }
      ],
      "if": "${{ github.ref == 'refs/heads/develop' }}"
    },
    "release": {
      "uses": "Kendall04/terragrunt_demo/.github/workflows/e1-release.yml@fe7e775812f139e5c2f6e044d9a37c95b0b747fc",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "with": {
        "request": "{\"source_commit\":\"${{ github.sha }}\"}"
      },
      "needs": [
        "infra-ready"
      ]
    },
    "deploy": {
      "uses": "Kendall04/terragrunt_demo/.github/workflows/e1-dev-deploy.yml@fe7e775812f139e5c2f6e044d9a37c95b0b747fc",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "with": {
        "request": "{\"action\":\"deliver\",\"release_id\":\"${{ needs.release.outputs.release_id }}\",\"replicas\":1}"
      },
      "needs": [
        "release"
      ]
    }
  }
}
