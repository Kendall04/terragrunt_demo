name: CD - Demo API Blue/Green Deploy

on:
  workflow_call:
    inputs:
      aws_region:
        required: false
        type: string
        default: us-east-1
      deploy_env:
        required: true
        type: string
    secrets:
      AWS_ROLE_APP_CD:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-demo-api-${{ inputs.deploy_env }}
  cancel-in-progress: false

jobs:
  cd-app:
    name: Build • Push ECR • Blue/Green Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy_env }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TG_ENV: ${{ inputs.deploy_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AWS Login via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role_arn: ${{ secrets.AWS_ROLE_APP_CD }}
          aws_region: ${{ env.AWS_REGION }}
          role_session_name: "app-cd"

      - name: Resolve Terraform backend
        id: backend
        uses: ./.github/actions/resolve-backend

      - name: Show resolved env and backend
        shell: bash
        run: |
          set -euo pipefail
          echo "TG_ENV          : ${TG_ENV}"
          echo "AWS_REGION      : ${AWS_REGION}"
          echo "TF_STATE_BUCKET : ${TF_STATE_BUCKET}"
          echo "TF_STATE_TABLE  : ${TF_STATE_TABLE}"
          echo "ACCOUNT_ID      : ${ACCOUNT_ID}"

      - name: Resolve deploy resources (by TG_ENV)
        id: deploy-env
        shell: bash
        run: |
          set -euo pipefail

          echo "Using TG_ENV=${TG_ENV}"

          if [ "${TG_ENV}" = "dev" ]; then
            echo "ECR_REPOSITORY=demo-dev-shared-demo-ms" >> "$GITHUB_ENV"
            echo "ECS_CLUSTER=demo-dev-platform-main-cluster" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_BLUE=demo-dev-app-api-blue-svc" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_GREEN=demo-dev-app-api-green-svc" >> "$GITHUB_ENV"

            echo "ALB_LISTENER_ARN=${{ vars.ALB_LISTENER_DEV }}" >> "$GITHUB_ENV"
            echo "ALB_CANDIDATE_RULE_ARN=${{ vars.ALB_CANDIDATE_RULE_DEV }}" >> "$GITHUB_ENV"
            echo "TG_BLUE_ARN=${{ vars.TG_BLUE_DEV }}" >> "$GITHUB_ENV"
            echo "TG_GREEN_ARN=${{ vars.TG_GREEN_DEV }}" >> "$GITHUB_ENV"

            echo "SCALE_DOWN_RULE_NAME=${{ vars.SCALE_DOWN_RULE_NAME_DEV }}" >> "$GITHUB_ENV"
            echo "SCALE_DOWN_LAMBDA_ARN=${{ vars.SCALE_DOWN_LAMBDA_DEV }}" >> "$GITHUB_ENV"

          elif [ "${TG_ENV}" = "prod" ]; then
            echo "ECR_REPOSITORY=demo-prod-shared-demo-ms" >> "$GITHUB_ENV"
            echo "ECS_CLUSTER=demo-prod-platform-main-cluster" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_BLUE=demo-prod-app-api-blue-svc" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_GREEN=demo-prod-app-api-green-svc" >> "$GITHUB_ENV"

            echo "ALB_LISTENER_ARN=${{ vars.ALB_LISTENER_PROD }}" >> "$GITHUB_ENV"
            echo "ALB_CANDIDATE_RULE_ARN=${{ vars.ALB_CANDIDATE_RULE_PROD }}" >> "$GITHUB_ENV"
            echo "TG_BLUE_ARN=${{ vars.TG_BLUE_PROD }}" >> "$GITHUB_ENV"
            echo "TG_GREEN_ARN=${{ vars.TG_GREEN_PROD }}" >> "$GITHUB_ENV"

            echo "SCALE_DOWN_RULE_NAME=${{ vars.SCALE_DOWN_RULE_NAME_PROD }}" >> "$GITHUB_ENV"
            echo "SCALE_DOWN_LAMBDA_ARN=${{ vars.SCALE_DOWN_LAMBDA_PROD }}" >> "$GITHUB_ENV"
          else
            echo "Unknown TG_ENV=${TG_ENV}"
            exit 1
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('demo-api/**/*.csproj') }}-${{ hashFiles('demo-api/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build & push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-api
          file: ./demo-api/Dockerfile
          push: true
          tags: |
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          provenance: false
          sbom: false

      - name: Export image URI
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${{ steps.build-image.outputs.digest }}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Detect blue/green state
        id: detect
        uses: ./.github/actions/ecs-detect-blue-green
        with:
          listener-arn: ${{ env.ALB_LISTENER_ARN }}
          candidate-rule-arn: ${{ env.ALB_CANDIDATE_RULE_ARN }}
          tg-blue-arn: ${{ env.TG_BLUE_ARN }}
          tg-green-arn: ${{ env.TG_GREEN_ARN }}
          blue-service: ${{ env.ECS_SERVICE_BLUE }}
          green-service: ${{ env.ECS_SERVICE_GREEN }}

      - name: Update inactive ECS service with new image (inactive stays stopped)
        shell: bash
        run: |
          set -euo pipefail

          INACTIVE_SERVICE="${{ steps.detect.outputs.inactive_service }}"
          echo "Inactive service: $INACTIVE_SERVICE"
          echo "New image URI: $IMAGE_URI"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$INACTIVE_SERVICE" \
            --desired-count 0 >/dev/null

          echo "Waiting for inactive service to be stable at desired=0..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$INACTIVE_SERVICE"

          for i in {1..30}; do
            TASKS=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$INACTIVE_SERVICE" \
              --desired-status RUNNING \
              | jq -r '.taskArns | length')
            if [ "$TASKS" = "0" ]; then
              break
            fi
            echo "Still RUNNING tasks: $TASKS (waiting...)"
            sleep 2
          done

          TD_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$INACTIVE_SERVICE" \
            | jq -r '.services[0].taskDefinition')

          echo "Current TD ARN (inactive): $TD_ARN"

          aws ecs describe-task-definition --task-definition "$TD_ARN" > td.json

          jq --arg IMAGE "$IMAGE_URI" '
            .taskDefinition
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .compatibilities,
                .deregisteredAt
              )
            | .containerDefinitions[0].image = $IMAGE
          ' td.json > new-td.json

          NEW_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-td.json \
            | jq -r '.taskDefinition.taskDefinitionArn')

          echo "New TD ARN: $NEW_TD_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$INACTIVE_SERVICE" \
            --task-definition "$NEW_TD_ARN" \
            --desired-count 0 >/dev/null

          for i in {1..30}; do
            CUR_TD=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$INACTIVE_SERVICE" \
              | jq -r '.services[0].taskDefinition')
            if [ "$CUR_TD" = "$NEW_TD_ARN" ]; then
              break
            fi
            echo "Service still shows TD=$CUR_TD (waiting...)"
            sleep 2
          done

          echo "Waiting for inactive service to be stable with new TD (still desired=0)..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$INACTIVE_SERVICE"

          RUNNING=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$INACTIVE_SERVICE" \
            --desired-status RUNNING \
            | jq -r '.taskArns | length')

          if [ "$RUNNING" != "0" ]; then
            echo "ERROR: Inactive service has RUNNING tasks after update (count=$RUNNING)"
            exit 1
          fi

          echo "OK: Inactive service updated to new image, stayed stopped, no task blip."

      - name: Move Docker cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: ECS Blue/Green switch
        uses: ./.github/actions/ecs-blue-green
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          blue-service: ${{ env.ECS_SERVICE_BLUE }}
          green-service: ${{ env.ECS_SERVICE_GREEN }}
          listener-arn: ${{ env.ALB_LISTENER_ARN }}
          candidate-rule-arn: ${{ env.ALB_CANDIDATE_RULE_ARN }}
          tg-blue-arn: ${{ env.TG_BLUE_ARN }}
          tg-green-arn: ${{ env.TG_GREEN_ARN }}
          desired-count: "1"
          drain-delay-minutes: "5"
          event-rule-name: ${{ env.SCALE_DOWN_RULE_NAME }}
          lambda-arn: ${{ env.SCALE_DOWN_LAMBDA_ARN }}
