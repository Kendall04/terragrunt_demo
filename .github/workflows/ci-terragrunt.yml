name: CI - Terragrunt Static

on:
  workflow_call:
    inputs:
      target_env:
        description: "Environment label used for static validation context."
        required: false
        type: string
        default: dev
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: us-east-1

permissions:
  contents: read

jobs:
  static-checks:
    name: Terragrunt Static Checks
    runs-on: ubuntu-latest
    env:
      TG_ENV: ${{ inputs.target_env }}
      AWS_REGION: ${{ inputs.aws_region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$TG_ENV" in
            dev|prod) ;;
            *)
              echo "::error::target_env must be dev or prod."
              exit 1
              ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          TG_VERSION="0.93.3"
          curl -L "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          set -euo pipefail
          tflint --version
          tflint --recursive

      - name: Install tfsec
        run: |
          set -euo pipefail
          curl -L "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64" -o tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin

      - name: Run tfsec
        run: tfsec --no-color . --minimum-severity=MEDIUM

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terragrunt HCL fmt
        run: terragrunt hcl format --check --working-dir terraform/live

      - name: Static summary
        run: |
          {
            echo "## Terragrunt static checks"
            echo
            echo "Target environment label: ${TG_ENV}"
            echo
            echo "Static CI stops here: no AWS OIDC, no remote backend init, and no plan."
          } >> "$GITHUB_STEP_SUMMARY"
