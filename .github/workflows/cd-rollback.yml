name: CD - Demo API Blue/Green Rollback

on:
  # Manual rollback from the GitHub Actions UI
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  cd-rollback:
    name: Blue/Green Rollback
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.deploy_env }}

    env:
      AWS_REGION: us-east-1
      TG_ENV: ${{ inputs.deploy_env }}

    steps:
      # 1) Checkout repo (for local composite actions)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) AWS login via OIDC (rollback role)
      - name: AWS Login via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role_arn: ${{ secrets.AWS_ROLE_APP_ROLLBACK }}
          aws_region: ${{ env.AWS_REGION }}
          role_session_name: "rollback-cd"

      # 3) Resolve TG_ENV (dev/prod)
      - name: Resolve environment (TG_ENV)
        id: env
        uses: ./.github/actions/resolve-env

      # 4) Resolve backend (TF state, ACCOUNT_ID)
      - name: Resolve Terraform backend
        id: backend
        uses: ./.github/actions/resolve-backend

      - name: Show resolved env and backend
        run: |
          echo "Event name      : ${GITHUB_EVENT_NAME}"
          echo "HEAD commit msg : ${GITHUB_HEAD_REF:-${GITHUB_REF}}"
          echo "TG_ENV          : ${TG_ENV}"
          echo "AWS_REGION      : ${AWS_REGION}"
          echo "TF_STATE_BUCKET : ${TF_STATE_BUCKET}"
          echo "TF_STATE_TABLE  : ${TF_STATE_TABLE}"
          echo "ACCOUNT_ID      : ${ACCOUNT_ID}"

      # 5) Resolve deploy resources (cluster, services, ALB, TGs, Lambda)
      - name: Resolve deploy resources (by TG_ENV)
        id: deploy-env
        shell: bash
        run: |
          set -euo pipefail

          echo "Using TG_ENV=${TG_ENV}"

          if [ "${TG_ENV}" = "dev" ]; then
            echo "ECS_CLUSTER=demo-dev-platform-main-cluster" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_BLUE=demo-dev-app-api-blue-svc" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_GREEN=demo-dev-app-api-green-svc" >> "$GITHUB_ENV"

            echo "ALB_LISTENER_ARN=${{ vars.ALB_LISTENER_DEV }}" >> "$GITHUB_ENV"
            echo "ALB_CANDIDATE_RULE_ARN=${{ vars.ALB_CANDIDATE_RULE_DEV }}" >> "$GITHUB_ENV"
            echo "TG_BLUE_ARN=${{ vars.TG_BLUE_DEV }}" >> "$GITHUB_ENV"
            echo "TG_GREEN_ARN=${{ vars.TG_GREEN_DEV }}" >> "$GITHUB_ENV"

            echo "SCALE_DOWN_RULE_NAME=${{ vars.SCALE_DOWN_RULE_NAME_DEV }}" >> "$GITHUB_ENV"
            echo "SCALE_DOWN_LAMBDA_ARN=${{ vars.SCALE_DOWN_LAMBDA_DEV }}" >> "$GITHUB_ENV"

          elif [ "${TG_ENV}" = "prod" ]; then
            echo "ECS_CLUSTER=demo-prod-platform-main-cluster" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_BLUE=demo-prod-app-api-blue-svc" >> "$GITHUB_ENV"
            echo "ECS_SERVICE_GREEN=demo-prod-app-api-green-svc" >> "$GITHUB_ENV"

            echo "ALB_LISTENER_ARN=${{ vars.ALB_LISTENER_PROD }}" >> "$GITHUB_ENV"
            echo "ALB_CANDIDATE_RULE_ARN=${{ vars.ALB_CANDIDATE_RULE_PROD }}" >> "$GITHUB_ENV"
            echo "TG_BLUE_ARN=${{ vars.TG_BLUE_PROD }}" >> "$GITHUB_ENV"
            echo "TG_GREEN_ARN=${{ vars.TG_GREEN_PROD }}" >> "$GITHUB_ENV"

            echo "SCALE_DOWN_RULE_NAME=${{ vars.SCALE_DOWN_RULE_NAME_PROD }}" >> "$GITHUB_ENV"
            echo "SCALE_DOWN_LAMBDA_ARN=${{ vars.SCALE_DOWN_LAMBDA_PROD }}" >> "$GITHUB_ENV"
          else
            echo "Unknown TG_ENV=${TG_ENV}"
            exit 1
          fi

      # 6) Blue/Green rollback switch (promote the other color)
      - name: ECS Blue/Green rollback switch
        uses: ./.github/actions/ecs-blue-green
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          blue-service: ${{ env.ECS_SERVICE_BLUE }}
          green-service: ${{ env.ECS_SERVICE_GREEN }}
          listener-arn: ${{ env.ALB_LISTENER_ARN }}
          candidate-rule-arn: ${{ env.ALB_CANDIDATE_RULE_ARN }}
          tg-blue-arn: ${{ env.TG_BLUE_ARN }}
          tg-green-arn: ${{ env.TG_GREEN_ARN }}
          desired-count: "1"
          drain-delay-minutes: "5"
          event-rule-name: ${{ env.SCALE_DOWN_RULE_NAME }}
          lambda-arn: ${{ env.SCALE_DOWN_LAMBDA_ARN }}
