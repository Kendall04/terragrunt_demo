{
  "name": "API environment executor",
  "on": {
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "scope": {
      "if": "${{ vars.API_DELIVERY_ENABLED == 'true' && github.repository == 'Kendall04/terragrunt_demo' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || github.ref_name == 'main') }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 5,
      "outputs": {
        "deploy": "${{ steps.scope.outputs.deploy }}"
      },
      "steps": [
        {
          "name": "Checkout trusted event revision",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "id": "scope",
          "name": "Exclude docs before environment concurrency",
          "run": "python3 -B -m scripts.api_delivery.cli classify"
        }
      ]
    },
    "delivery": {
      "if": "${{ vars.API_DELIVERY_ENABLED == 'true' && github.repository == 'Kendall04/terragrunt_demo' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || github.ref_name == 'main') && needs.scope.outputs.deploy == 'true' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 100,
      "environment": "${{ github.event_name == 'workflow_dispatch' && format('api-{0}', github.event.inputs.environment) || (github.ref_name == 'develop' && 'api-dev' || 'api-prod') }}",
      "concurrency": {
        "group": "e1-application-delivery-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'develop' && 'dev' || 'prod') }}",
        "cancel-in-progress": false
      },
      "permissions": {
        "contents": "read",
        "actions": "read",
        "pull-requests": "read",
        "id-token": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "API_CD_ENABLED": "${{ vars.API_DELIVERY_ENABLED }}",
        "API_BINDING_REF": "${{ vars.API_BINDING_REF }}",
        "AWS_EC2_METADATA_DISABLED": "true"
      },
      "steps": [
        {
          "name": "Checkout trusted event revision",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Require exact-SHA CI and resolve immutable promotion",
          "id": "prepare",
          "run": "python3 -B -m scripts.api_delivery.cli prepare --output request.json"
        },
        {
          "name": "Install existing hash-locked AWS dependencies",
          "if": "steps.prepare.outputs.deploy == 'true'",
          "run": "python3 -m pip install --require-hashes -r scripts/wp4d/requirements-codebuild.lock"
        },
        {
          "name": "Acquire environment-only deployment identity",
          "if": "steps.prepare.outputs.deploy == 'true'",
          "uses": "aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708",
          "with": {
            "role-to-assume": "${{ vars.API_DELIVERY_ROLE_ARN }}",
            "aws-region": "${{ vars.API_REGION }}",
            "allowed-account-ids": "${{ vars.API_ACCOUNT_ID }}",
            "role-session-name": "api-${{ github.run_id }}-${{ github.run_attempt }}",
            "role-duration-seconds": 3600,
            "unset-current-credentials": true
          }
        },
        {
          "name": "Build once in DEV or deploy approved digest in PROD",
          "if": "steps.prepare.outputs.deploy == 'true'",
          "run": "python3 -B -m scripts.api_delivery.cli execute --input request.json --output evidence/result.json",
          "id": "execute"
        },
        {
          "name": "Retain authenticated successful deployment",
          "if": "steps.execute.outputs.deployed == 'true'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "release-record",
            "path": "evidence/result.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "needs": "scope"
    }
  }
}
